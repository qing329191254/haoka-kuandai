name: haoka_app
description: 派客邦 · 号卡宽带代理 App（Flutter）
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  go_router: ^16.2.1
  provider: ^6.1.5
  image_picker: ^1.2.3
  url_launcher: ^6.3.2
  http: ^1.2.2
  shared_preferences: ^2.5.3
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6
  tobias: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon_1024.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/branding/app_icon_fg.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_icon.png
    - assets/branding/app_icon_1024.png
    - assets/branding/splash_logo.png
    - assets/regions/china_pca.json
    - assets/pay/wechat_pay.png
    - assets/pay/alipay.png
    - assets/brands/
